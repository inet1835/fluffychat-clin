name: Build FluffyChat for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Flutter (Latest Stable)
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'  # Берем самую новую стабильную версию
        cache: true

    - name: Enable Windows desktop support
      run: flutter config --enable-windows-desktop

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Install dependencies
      run: flutter pub get

    # Мы убрали "cargo build --release", так как flutter build windows --release 
    # сам запустит сборку Rust-части, если проект настроен правильно.

    - name: Build Windows release
      run: flutter build windows --release

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: fluffychat-windows-x64
        path: build/windows/x64/runner/Release/
        retention-days: 14
